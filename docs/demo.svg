<svg xmlns="http://www.w3.org/2000/svg" width="820" height="526" font-family="'SF Mono','Cascadia Code',Consolas,Menlo,'Microsoft YaHei',monospace" font-size="13">
  <defs>
    <style>
      .cmd{fill:#e6edf3} .prompt{fill:#3fb950;font-weight:bold} .dim{fill:#8b949e}
      .cyan{fill:#39c5cf} .white{fill:#e6edf3} .warn{fill:#e3b341} .green{fill:#3fb950}
      .gb{fill:#3fb950;font-weight:bold}
    </style>
  </defs>
  <!-- window -->
  <rect x="0" y="0" width="820" height="526" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="0" y="0" width="820" height="34" rx="10" fill="#161b22"/>
  <rect x="0" y="24" width="820" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="410" y="21" text-anchor="middle" class="dim" font-size="12">logistics-settlement-recon — 结算对账流水线（v0.3 合同费率基准）</text>

  <!-- body -->
  <g>
    <text x="18" y="60"><tspan class="prompt">$ </tspan><tspan class="cmd">python src/run_pipeline.py</tspan></text>
    <text x="18" y="82" class="dim">[2/3] 执行 SQL：72 条合同费率算逐单应付 → 三方对账 + 应收账龄 …</text>
    <text x="18" y="100" class="dim">[3/3] 导出报表到 output/ …</text>

    <text x="18" y="128" class="cyan">=== 三方对账汇总 recon_summary ===</text>
    <text y="148"><tspan x="18" class="dim">recon_status</tspan><tspan x="200" class="dim">n_records</tspan><tspan x="320" class="dim">规则去向（异常建议一律待人工审批）</tspan></text>
    <text y="168"><tspan x="18" class="white">MATCH</tspan><tspan x="200" class="white">86,094</tspan><tspan x="320" class="green">自动放行</tspan></text>
    <text y="186"><tspan x="18" class="warn">OVERBILLED</tspan><tspan x="200" class="white">3,508</tspan><tspan x="320" class="white">建议追回差额</tspan></text>
    <text y="204"><tspan x="18" class="warn">DUPLICATE</tspan><tspan x="200" class="white">2,989</tspan><tspan x="320" class="white">建议拒付重复部分</tspan></text>
    <text y="222"><tspan x="18" class="warn">NOT_BILLED</tspan><tspan x="200" class="white">2,922</tspan><tspan x="320" class="white">建议催开票、确认应付</tspan></text>
    <text y="240"><tspan x="18" class="warn">UNDERBILLED</tspan><tspan x="200" class="white">2,298</tspan><tspan x="320" class="white">人工复核：折扣还是漏计</tspan></text>
    <text y="258"><tspan x="18" class="warn">MISSING_ORDER</tspan><tspan x="200" class="white">1,200</tspan><tspan x="320" class="white">建议拒付整笔（幽灵计费）</tspan></text>
    <text y="276"><tspan x="18" class="warn">NOT_DELIVERED</tspan><tspan x="200" class="white">407</tspan><tspan x="320" class="white">建议拒付 398 · 证据冲突转人工 9</tspan></text>
    <text y="294"><tspan x="18" class="dim">NO_ACTIVITY</tspan><tspan x="200" class="dim">1,792</tspan><tspan x="320" class="dim">未送达且无账单，不进复核队列</tspan></text>

    <text x="18" y="322" class="cyan">=== 规则执行后对照注入标签评估（99,418 条）===</text>
    <text y="342"><tspan x="18" class="gb">召回率 100% · 查准率 99.955%</tspan><tspan class="white">（误报 6 · 漏检 0）</tspan></text>
    <text x="18" y="360" class="green">20% 留出集：召回率 100% · 查准率 100%</text>

    <text x="18" y="390"><tspan class="prompt">$ </tspan><tspan class="cmd">python src/audit_agent.py --top 25</tspan></text>
    <text x="18" y="412" class="dim">[完成] 复核 13,324 条异常 → exception_review.csv / .md</text>
    <text y="432"><tspan x="18" class="white">自动放行 86,094 · 转人工复核 13,324 · 自动执行 </tspan><tspan class="gb">0</tspan></text>

    <text x="18" y="462" class="cyan">=== 应收账龄 · DSO · ECL ===</text>
    <text y="482"><tspan x="18" class="white">DSO </tspan><tspan class="gb">53.7 天</tspan><tspan class="white"> · 加权 ECL </tspan><tspan class="gb">3.26%</tspan><tspan class="white"> · 90+ 占比 </tspan><tspan class="gb">1.73%</tspan></text>
    <text x="18" y="508"><tspan class="prompt">$ </tspan><tspan class="cmd">▍</tspan></text>
  </g>
</svg>
